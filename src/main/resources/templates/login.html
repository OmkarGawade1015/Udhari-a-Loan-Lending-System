<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main class="auth-layout">
    <section class="auth-card" aria-labelledby="loginHeading">
        <p class="eyebrow">Welcome back</p>
        <h1 id="loginHeading">Sign in to Udhari</h1>
        <p>View your loan applications and repayments.</p>
        <div id="loginError" class="form-error" role="alert" aria-live="assertive" hidden></div>
        <form id="loginForm" novalidate>
            <div class="form-field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
            </div>
            <button id="loginButton" class="button button-primary" type="submit">Sign in</button>
        </form>
        <p class="auth-switch">New to Udhari? <a th:href="@{/register}">Create an account</a></p>
    </section>
</main>
<script th:src="@{/js/login.js}" defer></script>
</body>
</html>
