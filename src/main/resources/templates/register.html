<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Create account')}"></head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main class="auth-layout">
    <section class="auth-card" aria-labelledby="registerHeading">
        <p class="eyebrow">Borrower account</p>
        <h1 id="registerHeading">Create your account</h1>
        <p>Enter your profile and sign-in details to apply for a loan.</p>
        <div id="registerError" class="form-error" role="alert" aria-live="assertive" hidden></div>
        <div id="registerSuccess" class="form-success" role="status" aria-live="polite" hidden></div>
        <form id="registerForm" novalidate>
            <div class="form-field">
                <label for="fullName">Full name</label>
                <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="120" aria-describedby="fullNameError" required>
                <span id="fullNameError" class="field-error" data-error-for="fullName"></span>
            </div>
            <div class="form-field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" aria-describedby="emailError" required>
                <span id="emailError" class="field-error" data-error-for="email"></span>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="passwordError" required>
                <span id="passwordError" class="field-error" data-error-for="password"></span>
            </div>
            <div class="form-field">
                <label for="monthlyIncome">Monthly income (INR)</label>
                <input id="monthlyIncome" name="monthlyIncome" type="number" inputmode="decimal" min="0.01" step="0.01" aria-describedby="monthlyIncomeError" required>
                <span id="monthlyIncomeError" class="field-error" data-error-for="monthlyIncome"></span>
            </div>
            <div class="form-field">
                <label for="employmentType">Employment type</label>
                <input id="employmentType" name="employmentType" type="text" maxlength="40" aria-describedby="employmentTypeError" required>
                <span id="employmentTypeError" class="field-error" data-error-for="employmentType"></span>
            </div>
            <button id="registerButton" class="button button-primary" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already registered? <a th:href="@{/login}">Sign in</a></p>
    </section>
</main>
<script th:src="@{/js/register.js}" defer></script>
</body>
</html>
